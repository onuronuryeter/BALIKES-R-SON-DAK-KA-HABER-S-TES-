<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/static/images/favicon.jpg">
  <title>Admin Girişi — {{ site_name }}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
<div class="admin-login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">B</div>
      <h1 class="login-title">Admin Girişi</h1>
      <p class="login-subtitle">{{ site_name }}</p>
    </div>

    {% if error %}
    <div class="login-error" id="login-error">{{ error }}</div>
    {% else %}
    <div class="login-error" id="login-error" style="display:none;"></div>
    {% endif %}

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Kullanıcı Adı</label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-control"
          placeholder="admin"
          autocomplete="username"
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>
      <button
        type="submit"
        class="btn btn-primary btn-lg"
        style="width:100%;justify-content:center;margin-top:8px;"
      >
        Giriş Yap
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:#6c757d;">
      <a href="/">← Siteye Dön</a>
    </p>
  </div>
</div>

<script src="/static/js/main.js" defer></script>
</body>
</html>
